repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name 'BlameJared'
        url 'https://maven.blamejared.com'
    }
}

dependencies {
    implementation cleanroom.userdev(propertyString('cleanroom_version'))

    compileOnly deobf("maven.modrinth:jei:${propertyString('jei_version')}")
    runtimeOnly deobf("maven.modrinth:jei:${propertyString('jei_version')}")
    testImplementation deobf("maven.modrinth:jei:${propertyString('jei_version')}")
    implementation deobf("vazkii.patchouli:Patchouli:${propertyString('patchouli_version')}")
    compileOnly deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.715')
    runtimeOnly deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.715')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
