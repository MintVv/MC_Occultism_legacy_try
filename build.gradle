plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.matthewprenger.cursegradle' version '1.4.0' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'org.jetbrains.changelog' version '2.5.0'
}

apply from: 'gradle/scripts/helpers.gradle'

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName.set(propertyString('mod_id'))
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

apply from: 'gradle/scripts/dependencies.gradle'

cleanroom {
    runs {
        client {
            configure {
                username = propertyString('minecraft_username')
                jvmArgs propertyStringList('extra_jvm_args')
            }
        }
        server {
            configure {
                jvmArgs propertyStringList('extra_jvm_args')
            }
        }
    }
}

def generatedTags = layout.buildDirectory.dir('generated/sources/tags/java')
def tagProperties = new Properties()
file('tags.properties').withInputStream { tagProperties.load(it) }
def tagValues = tagProperties.collectEntries { key, value -> [(key): interpolate(value)] }

tasks.register('generateTags') {
    inputs.file('tags.properties')
    inputs.properties(tagValues)
    outputs.dir(generatedTags)
    doLast {
        def output = generatedTags.get().file('com/occultism/occultism/Tags.java').asFile
        output.parentFile.mkdirs()
        def fields = tagValues.collect { key, value ->
            def escaped = value.replace('\\', '\\\\').replace('"', '\\"')
            "    public static final String ${key} = \"${escaped}\";"
        }.join('\n')
        output.setText("package com.occultism.occultism;\n\npublic final class Tags {\n${fields}\n\n    private Tags() {\n    }\n}\n", 'UTF-8')
    }
}

sourceSets.main.java.srcDir(tasks.named('generateTags'))

def resourceValues = ['mod_id', 'mod_name', 'mod_version', 'mod_description', 'mod_authors',
                      'mod_credits', 'mod_url', 'mod_update_json', 'mod_logo_path'].collectEntries {
    [(it): propertyString(it)]
}
resourceValues.mod_authors = propertyStringList('mod_authors', ',').join(', ')

processResources {
    inputs.properties(resourceValues)
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(resourceValues)
    }
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(25))
    })
    if (propertyBool('show_testing_output')) {
        testLogging.showStandardStreams = true
    }
    if (project.hasProperty('testLocale')) {
        systemProperty 'user.language', project.property('testLocale')
        systemProperty 'user.country', ''
    }
}

String parserChangelog() {
    return changelog.renderItem(changelog.get(propertyString('mod_version')).withHeader(false).withEmptySections(false),
            org.jetbrains.changelog.Changelog.OutputType.MARKDOWN)
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
